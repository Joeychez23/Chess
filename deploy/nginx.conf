# nginx site for the chess server
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/chess
#          sudo ln -s /etc/nginx/sites-available/chess /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then:    sudo certbot --nginx -d chess.aws-prac-route53.com
#          (certbot adds the HTTPS server block and the HTTP -> HTTPS redirect)

# 10 requests/second per IP, bursts of 40 (a page load is about 10 requests, the sprites come from CloudFront)
limit_req_zone $binary_remote_addr zone=chess:10m rate=10r/s;

# Socket.IO upgrades to a WebSocket. Named $chess_connection_upgrade, not $connection_upgrade,
# because chess-engine-api's site on the same instance already defines that one and nginx won't start with two
map $http_upgrade $chess_connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name chess.aws-prac-route53.com;

	client_max_body_size 16k;

	location / {
		limit_req zone=chess burst=40 nodelay;
		limit_req_status 429;

		proxy_pass http://127.0.0.1:8080; # API_PORT in server/.env
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $chess_connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
