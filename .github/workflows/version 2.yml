# Bumps the version in package.json & package-lock.json when a pull request merges into develop. Release pull requests to main carry it from there.
# The pull request's label picks the level: semver:major, semver:minor or semver:patch, the highest wins & no label is a patch.
# A pull request that changed the version itself isn't bumped again.
# The push uses GITHUB_TOKEN, which doesn't start other workflows, so the bump doesn't run CI or this workflow again.
# Actions are pinned to commit SHAs (the tag is in the trailing comment); Dependabot (.github/dependabot.yml) keeps them current.

name: Version

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read

jobs:
  bump:
    name: Bump version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - name: Bump, commit & push
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version_at() { git show "$1:package.json" | node -pe 'JSON.parse(require("fs").readFileSync(0)).version'; }
          if [ "$(version_at "$MERGE_SHA^1")" != "$(version_at "$MERGE_SHA")" ]; then
            echo "#$PR_NUMBER changed the version itself, nothing to bump"
            exit 0
          fi

          case " $LABELS " in
            *" semver:major "*) level=major ;;
            *" semver:minor "*) level=minor ;;
            *) level=patch ;;
          esac

          version=$(npm version "$level" --no-git-tag-version --ignore-scripts)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Bump version to ${version#v} ($level, #$PR_NUMBER)"
          git pull --rebase origin develop # ANOTHER MERGE MAY HAVE LANDED SINCE THE CHECKOUT
          git push origin HEAD:develop
