<!DOCTYPE html>
<html lang="en" class="loadingPage"> <!-- loadingPage: THE LAST PAGE STAYS ON SCREEN UNTIL THIS PAGE IS DRAWN (showPage() REMOVES IT) -->

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content=" IE=edge">
	<link rel="icon" type="image/png" sizes="32x32" href="<%= process.env.CHESS_ASSETS_URL %>/images/icon/bishop-32.png" />
	<link rel="icon" type="image/png" sizes="192x192" href="<%= process.env.CHESS_ASSETS_URL %>/images/icon/bishop-192.png" />
	<link rel="apple-touch-icon" href="<%= process.env.CHESS_ASSETS_URL %>/images/icon/bishop-180.png" /> <!-- iOS HOME SCREEN, ON THE BAIZE GREEN -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="theme-color" content="#0c2a1f" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Serif&display=swap">
	<title>Sign in // Chess</title>
	<style> /* IN THE PAGE, NOT home.css: IT'S NEEDED FOR THE FIRST PAINT, THE CSS FILES ARE ADDED BY THE BUNDLE AFTER THAT */
		@view-transition { navigation: auto; } /* HOME & A GAME FADE INTO THIS PAGE THE SAME WAY */
		html.loadingPage::view-transition-group(*),
		html.loadingPage::view-transition-old(*),
		html.loadingPage::view-transition-new(*) { animation-play-state: paused; } /* THE LAST PAGE STAYS ON SCREEN UNTIL THIS PAGE IS DRAWN */
		::view-transition-group(*) { animation-duration: 400ms; }
		@media (prefers-reduced-motion: reduce) { /* NO FADE: THE LAST PAGE STILL STAYS ON SCREEN WHILE loadingPage IS ON, THEN THIS PAGE IS JUST THERE (0s WHILE PAUSED WOULD SHOW THE UNFINISHED PAGE) */
			html:not(.loadingPage)::view-transition-group(*) { animation-duration: 0s; }
		}
		html { background-color: #0c2a1f; } /* THE PAGE'S GREEN FROM THE FIRST PAINT, NOT WHITE */
	</style>
</head>

<body id="body">
	<button id="optBtn" type="button" aria-label="Menu" aria-controls="menuContainer"><span></span><span></span><span></span></button>
	<nav id="menuContainer" aria-label="Menu">
		<div id="resultDisplay">Chess</div>
		<ul id="menuButtonList">
			<li><a class="menuButton" href="/">Home</a></li>
			<li><a class="menuButton" href="/login" aria-current="page">Sign in</a></li>
		</ul>
	</nav>

	<main class="page">
		<section class="hero">
			<div class="heroText">
				<p class="spec">Your account</p>
				<h1 class="title">Sign in</h1>
				<p class="lead">Play a friend and keep your games, on any device.</p>
			</div>
			<form class="box boxBaize" id="loginForm">
				<div class="boxHead"><h2 class="label">Email &amp; password</h2><span class="spec">No. 01</span></div>
				<div class="loginField">
					<label class="spec" for="loginEmail">Email</label>
					<div class="field">
						<input type="email" name="email" id="loginEmail" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" required>
					</div>
				</div>
				<div class="loginField">
					<label class="spec" for="loginPassword">Password</label>
					<div class="field">
						<input type="password" name="password" id="loginPassword" autocomplete="current-password" required>
						<button class="btn btnLine" id="showPassword" type="button" aria-controls="loginPassword" aria-label="Show password">Show</button>
					</div>
				</div>
				<button class="btn btnCream" id="loginBtn" type="submit">Sign in</button>
				<p class="spec note" id="loginNote" role="status" aria-live="polite"></p>
				<div class="field boxBottom">
					<a class="btn btnLine universalLogin" href="/api/auth/login">Create account</a>
					<a class="btn btnLine universalLogin" href="/api/auth/login">Forgot password?</a>
				</div>
			</form>
		</section>
	</main>
</body>

</html>
