<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content=" IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	<link rel="shortcut icon" href="#">
	<title>Template</title>
</head>

<body id="body">
	<div id="menuContainer">
		<div id="menuBox">
			<div id="menuContent">
				<div id="resultDisplay">Chess</div>
				<div id="menuButtonList">
					<li><button class="menuButton" id="optResume">Resume</button></li>
					<li><button class="menuButton" id="optRestart">Restart</button></li>
					<li><button class="menuButton" id="optSettings">Home</button></li>

					<li><button class="menuButton" id="optNewSolo">Play AI</button></li>
					<li><button class="menuButton" id="optNewMulti">Play Friends</button></li>

					<form id="muliplayerForm">
						<input class="newGameInput" type="text" id="enterMultiEmail" name="enterMultiEmail" placeholder="Opponent Email">
						<button class="newGameInput" id="enterMultiSubmit">Submit</button>
						<br>
					</form>

					<li><button class="menuButton" id="optExit">Exit</button></li>

				</div>
			</div>
		</div>
	</div>

	<main id="main">
		<button id="optBtn" class="material-icons"> settings </button>
	</main>
</body>

</html>
