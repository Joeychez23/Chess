<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content=" IE=edge">
	<link rel="icon" href="<%= process.env.CHESS_ASSESTS_URL %>/images/images.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<meta name="theme-color" content="#220B00" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Audiowide">
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	<title>Chess</title>
</head>

<body id="body">
	<div id="menuContainer">
		<div id="menuBox">
			<div id="menuContent">
				<div id="resultDisplay">Chess</div>
				<div id="menuButtonList">
					<li><button class="menuButton" id="optNewSolo">Play AI</button><select id="aiLevel" aria-label="AI level"></select></li>
					<li><button class="menuButton" id="optNewMulti">Play Friends</button></li>

					<form id="muliplayerForm">
						<input class="newGameInput" type="text" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" id="enterMultiEmail" name="enterMultiEmail" placeholder="Opponent Email">
						<button class="newGameInput" id="enterMultiSubmit">Submit</button>
						<br>
					</form>

					<li><button class="menuButton" id="optExit">Logout</button></li>
				</div>
			</div>
		</div>
	</div>

	<main id="main">
		<button id="optBtn" class="material-icons" type="button" aria-label="Menu"> settings </button>
		<div id="gameContainer">
			<div id="loadingDiv">Loading...</div>
			<ul id="gameList"></ul>
		</div>
	</main>
</body>

</html>
